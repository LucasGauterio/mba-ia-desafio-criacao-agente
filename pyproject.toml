[project]
name = "aurora-assistant"
version = "0.1.0"
description = "Assistente Virtual do Residencial Aurora - API e Agentes de IA com Google ADK"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.2.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "greenlet>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
aurora = "aurora.cli:main"
aurora-reset = "aurora.cli:reset"
aurora-run = "aurora.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurora"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=aurora --cov-report=term-missing"

[tool.coverage.run]
source = ["src/aurora"]

[tool.coverage.report]
skip_empty = true
